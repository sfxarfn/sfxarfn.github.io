/* Mirrors the Android app (android-app/.../ui): Theme.kt colors and type, same layouts. 1 dp = 1 CSS px. */
:root {
  --screen: #08090C; --s: #0F1117; --low: #12141A; --high: #1B1D26; --highest: #36343B;
  --on: #E6E7EC; --label: #A4A7B5; --label60: rgba(164, 167, 181, .6); --label70: rgba(164, 167, 181, .7);
  --outline: #3A3D4A; --ov: #1E2029; --error: #D95F5F; --online: #4EAF6B; --amber: #E0A23C;
  --accent: #9D86E0;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--screen); color: var(--on); overflow: hidden; }
body {
  font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 20px; letter-spacing: .25px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; letter-spacing: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }

/* Material 3 type scale with the app's overrides (Theme.kt). */
.hm { font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -.3px; }
.hs { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: 0; }
.tl { font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: 0; }
.tm { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: .15px; }
.ts { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }
.bl { font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: .5px; }
.bm { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: .25px; }
.bs { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .4px; }
.ll { font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: .2px; }

const icons = new Map(); // bundleId -> data URL, or null while loading or failed

  icons.set(bundleId, null);

      icons.set(id, 'data:image/png;base64,' + reply.png);
      iconsLoaded += 1;

// ---------- layouts (TileLayout.kt) ----------

const LAYOUT = {
  left: [0, 0, 0.5, 1, 'Left'], right: [0.5, 0, 0.5, 1, 'Right'], top: [0, 0, 1, 0.5, 'Top'], bottom: [0, 0.5, 1, 0.5, 'Bottom'],
  topLeft: [0, 0, 0.5, 0.5, 'Top left'], topRight: [0.5, 0, 0.5, 0.5, 'Top right'],
  bottomLeft: [0, 0.5, 0.5, 0.5, 'Bottom left'], bottomRight: [0.5, 0.5, 0.5, 0.5, 'Bottom right'],
  maximize: [0, 0, 1, 1, 'Maximize'],

const rect = (k) => { const [x, y, w, hh] = LAYOUT[k]; return { l: x, t: y, r: x + w, b: y + hh }; };

function place(el, r) {

  el.style.top = 'calc(' + r.t * 100 + '% + 3px)';
  el.style.width = 'calc(' + (r.r - r.l) * 100 + '% - 6px)';
  el.style.height = 'calc(' + (r.b - r.t) * 100 + '% - 6px)';

  if (S.page !== 0 || S.editing) { tabs.replaceChildren(); return; }
  const visible = S.apps.reduce((n, a) => n + (a.windowList || []).filter((w) => w.state === 'visible').length, 0);
  const showing = S.displays.filter((d) => S.stages.some((g) => g.showing && g.screenName === d.name) || (d.windows || []).some((w) => w.showing)).length;
  const tab = (key, label, count) => {
    const on = S.tab === key;
    const el = h('button', { type: 'button', class: 'tab' + (on ? ' on' : '') },
      h('span', { class: 'eyebrow word' }, label),
      on ? h('span', { class: 'eyebrow count' }, String(count)) : null);
    el.addEventListener('click', () => { if (S.tab !== key) { buzz(); S.tab = key; closePill(); render(true); } });
    return el;
  };
  tabs.replaceChildren(tab('apps', 'APPS', visible), box('gap'), tab('stages', 'STAGES', showing));
}

pager.addEventListener('scroll', () => {
  const page = Math.round(pager.scrollLeft / Math.max(1, pager.clientWidth));
  if (page === S.page) return;
  S.page = page;
  closePill();
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === page));
  renderStrip();
}, { passive: true });
setInterval(() => { if (S.conn === 'ready' && S.page === 2) render(); }, 30000);

// ---------- not connected (PairingScreens.kt) ----------

function sonar(iconName, opts) {
  const o = opts || {};
  const el = h('div', { class: 'sonar' + (o.fail ? ' fail' : '') },
    box('core'), o.rings === 1 ? box('ring') : [box('ring'), box('ring'), box('ring')],
    h('div', { class: 'disc' }, svg(iconName, 37)));
  el.style.setProperty('--period', (o.period || 2600) / 1000 + 's');
  return el;
}
const wordmark = () => h('div', { class: 'wordmark' }, h('i'), h('span', { class: 'tm' }, 'deckhand'));
const split = (hero, body) => h('div', { class: 'split' }, h('div', { class: 'hero' }, hero), h('div', { class: 'body' }, body));

function helpCard() {
  const lines = [
    ['1', 'Check the deckhand icon is in ' + macLabel() + '’s menu bar.'],
    ['2', 'Put this device on the same Wi-Fi as the Mac, not guest or mobile data.'],
  ];
  const third = h('div', { class: 'line bm' }, h('span', { class: 'num lm' }, '3'),
    h('span', null, 'First time on this device? ', h('a', { href: installUrl() }, 'Install the Mac’s certificate'), ' so the browser trusts it.'));
  return h('div', { class: 'help' }, h('div', { class: 'tm' }, 'Not showing up?'),
    lines.map(([n, t]) => h('div', { class: 'line bm' }, h('span', { class: 'num lm' }, n), h('span', null, t))), third);
}
const noteLine = () => (S.note ? [h('div', { class: 'gap12' }), h('div', { class: 'bm', style: 'color:var(--error)' }, S.note)] : null);

function renderGate() {
  const gate = $('gate');
  if (S.conn === 'ready') { gate.hidden = true; gate.replaceChildren(); return; }
  gate.hidden = false;
  closePill();
  const name = macLabel();
  let view;
  if (S.conn === 'address') {
    const input = h('input', { class: 'field', type: 'text', placeholder: '192.168.1.20:8766', autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', inputmode: 'url' });
    const go = () => {
      const addr = cleanAddr(input.value);
      if (!addr) { S.note = 'Enter the address like 192.168.1.20:8766'; renderGate(); return; }
      agentAddr = addr; S.unreachable = false; S.note = ''; favorites = loadFavorites(); connect(false);
    };
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    view = split([wordmark(), sonar('wifi')], [
      h('div', { class: 'hm' }, 'Which Mac?'), h('div', { class: 'gap8' }),
      h('div', { class: 'bl label' }, 'Enter the address from the Mac’s menu bar (deckhand › Browser client), or scan its QR code.'),
      h('div', { class: 'gap20' }), input, noteLine(), h('div', { class: 'gap20' }),
      h('button', { type: 'button', class: 'btn-primary ll', on: { click: go } }, 'Connect')]);
  } else if (S.conn === 'unpaired') {
    const card = h('button', { type: 'button', class: 'maccard press', on: { click: () => connect(true) } },
      h('div', { class: 'lap' }, svg('laptop', 28)),
      h('div', { class: 'grow' }, h('div', { class: 'tm one' }, name), h('div', { class: 'bs label one' }, agentAddr)),
      h('div', { class: 'go' }, svg('arrow', 20)));
    view = split([wordmark(), sonar('wifi')], [
      h('div', { class: 'hm' }, 'Pair with ' + name), h('div', { class: 'gap8' }),
      h('div', { class: 'bl label' }, 'Tap it below, then click Allow on the Mac.'), h('div', { class: 'gap20' }),
      card, noteLine(), S.unreachable ? helpCard() : null,
      REMOTE ? h('button', { type: 'button', class: 'btn-text ll', style: 'margin-top:8px', on: { click: () => { store.del(AGENT_KEY); agentAddr = ''; setConn('address'); } } }, 'Use a different address') : null]);
  } else if (S.conn === 'pairfail') {
    view = split([sonar('error', { fail: true, rings: 1, period: 4000 })], [
      h('div', { class: 'hm' }, 'Couldn’t pair'), h('div', { class: 'gap8' }),
      h('div', { class: 'bl label' }, S.note || 'Something went wrong.'), S.unreachable ? helpCard() : null, h('div', { class: 'gap20' }),
      h('button', { type: 'button', class: 'btn-primary ll', on: { click: () => connect(true) } }, 'Try again'), h('div', { style: 'height:4px' }),
      h('button', { type: 'button', class: 'btn-text ll', on: { click: () => setConn('unpaired') } }, 'Back')]);
  } else if (S.conn === 'pairing') {
    const cancel = () => { dropSocket(); setConn('unpaired'); };
    if (!S.code) {
      view = split([sonar('laptop', { period: 2200 })], [
        h('div', { class: 'hm' }, 'Connecting…'), h('div', { class: 'gap8' }), h('div', { class: 'bl label' }, name), h('div', { class: 'gap24' }),
        h('button', { type: 'button', class: 'btn-text ll', on: { click: cancel } }, 'Cancel')]);
    } else {
      const digits = h('div', { class: 'code' });
      S.code.split('').forEach((c, i) => { if (i === 3) digits.append(box('sp')); digits.append(h('div', { class: 'd' }, c)); });
      view = split([sonar('laptop', { period: 2200 })], [
        h('div', { class: 'hm' }, 'Click ', h('span', { style: 'color:var(--accent);font-weight:700' }, 'Allow'), ' on your Mac'), h('div', { class: 'gap8' }),
        h('div', { class: 'bl label' }, 'Make sure ' + name + ' shows this code'), h('div', { class: 'gap18' }), digits, h('div', { class: 'gap18' }),
        h('div', { style: 'display:flex;align-items:center;gap:20px' }, h('div', { class: 'dots3' }, h('i'), h('i'), h('i')),
          h('button', { type: 'button', class: 'btn-outline ll', on: { click: cancel } }, 'Cancel'))]);
    }
  } else {
    view = split([sonar('laptop')], [
      h('div', { class: 'hm' }, name), h('div', { class: 'gap12' }),
      h('div', { class: 'statuspill lm' }, h('i'), S.attempts === 0 ? 'Connecting' : 'Looking for your Mac'),
      S.attempts >= 3 ? h('div', { class: 'bm label', style: 'margin-top:16px;max-width:420px' }, 'Make sure the Mac is awake, deckhand is running, and you’re on the same Wi-Fi.') : null,
      S.unreachable ? helpCard() : null, noteLine(), h('div', { class: 'gap28' }),
      h('button', { type: 'button', class: 'btn-quiet ll', on: { click: () => { store.del(tokenKey()); dropSocket(); setConn('unpaired'); } } }, 'Forget this Mac')]);
  }
  gate.replaceChildren(view);
}

renderGate();
connect(false);
})();
</script>
</body>
</html>
